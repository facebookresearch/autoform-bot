name: tests

on:
  push:
    branches: ["scratch/**"]

permissions:
  contents: read

jobs:
  atlas-typeset:
    name: ATLAS formulas typeset before and after
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Install pinned MathJax 3.2.2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 5m curl -sSfL --retry 4 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --speed-limit 1024 --speed-time 30 \
            https://registry.npmjs.org/mathjax/-/mathjax-3.2.2.tgz -o mathjax.tgz
          echo "1b9c0a1c44df864e915690558e72adb9cc5203360daefd385084ced3b6c64c09  mathjax.tgz" \
            | sha256sum --check --strict
          mkdir mathjax
          tar xzf mathjax.tgz -C mathjax
      - run: uv run --frozen python scratch/atlas_typeset.py mathjax/package scratch/before scratch/after
