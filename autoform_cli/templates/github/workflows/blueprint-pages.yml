name: Blueprint Pages

# The site publishes only a commit that `autoform verify` passed on main, so it
# never shows progress Lean did not check, and it keeps the last verified site
# while main is red. Pull requests and manual runs build the site to check it,
# and never deploy.
on:
  workflow_run:
    workflows: [autoform verify]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "blueprint/**"
      - "**.lean"
      - "mkdocs.yml"
      - "theme/**"
      - ".github/workflows/blueprint-pages.yml"
  workflow_dispatch:

# The build job reads the verify run's .ilean files, below; the deploy job has
# permissions of its own.
permissions:
  contents: read
  actions: read

env:
  AUTOFORM_SOURCE: {{AUTOFORM_SOURCE_YAML}}
  AUTOFORM_REF: {{AUTOFORM_REF_YAML}}

# Deploys queue in one group, so none is cancelled by a build that cannot
# deploy; every other run gets a group of its own. A run deploys under the
# same condition as the build job's `if`.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_run'
    && github.event.workflow_run.conclusion == 'success'
    && github.event.workflow_run.event == 'push'
    && github.event.workflow_run.head_branch == 'main'
    && github.event.workflow_run.path == '.github/workflows/autoform-verify.yml'
    && github.event.workflow_run.head_repository.full_name == github.repository)
    && 'blueprint-pages-deploy' || format('blueprint-pages-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    # A verify run deploys only when it is this project's own verify workflow,
    # by its file rather than its name, and it passed on a push to main here.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.path == '.github/workflows/autoform-verify.yml'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check out project
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Never main's newest commit in place of the verified one.
      - name: Confirm the checked-out commit is the verified one
        if: github.event_name == 'workflow_run'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test -n "$VERIFIED_SHA" && test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # The verify run's .ilean files, from the build of this very commit, say
      # which declaration each name in the Lean sources means. Without them, as
      # on pull requests and manual runs, render links names as before.
      - name: Fetch the build's name references
        id: ileans
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autoform-ileans
          path: ${{ runner.temp }}/ileans
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Rejects cycles and dangling links, and fails when a node names a Lean
      # declaration that is not in the sources. Render, two steps on, reports
      # the warnings about the site's pages, so check leaves them to it when
      # this AUTOFORM_REF's check has --no-site-warnings.
      - name: Validate the theorem DAG and its declarations
        run: |
          autoform="git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          help="$(uvx --from "$autoform" autoform check --help)"
          case "$help" in
            *--no-site-warnings*) leave_to_render=--no-site-warnings ;;
            *) leave_to_render= ;;
          esac
          uvx --from "$autoform" autoform check blueprint --lean-root . $leave_to_render

      # Lists every audit finding and warning, such as a declared coverage gap
      # or an oversized node. It builds no Lean, and nothing it reports fails
      # the build or stops a deploy: publication and audit are separate gates.
      - name: Audit the roadmap (report only)
        continue-on-error: true
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform audit blueprint --lean-root .

      # Writes site-src/: statement boxes, derived statuses, dependency maps,
      # and permalinks into the Lean code at this exact commit. A deploy names
      # the verified commit, since GITHUB_SHA is then main's newest one.
      # With the build's .ilean files, when the fetch got them all and this
      # AUTOFORM_REF's render reads them, each name in a statement's Lean links
      # exactly what it means.
      - name: Render the blueprint
        env:
          PAGES_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ILEANS: ${{ steps.ileans.outcome == 'success' && format('{0}/ileans', runner.temp) || '' }}
        run: |
          autoform="git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          ileans=()
          if [ -n "$ILEANS" ]; then
            help="$(uvx --from "$autoform" autoform render --help)"
            case "$help" in
              *--ileans*) ileans=(--ileans "$ILEANS") ;;
            esac
          fi
          uvx --from "$autoform" autoform render blueprint \
            --output site-src \
            --lean-root . \
            --require-declarations \
            --ref "$PAGES_REF" \
            "${ileans[@]}"

      # MathJax 3.2.2, the release the site loads, from npm's tarball checked
      # by its sha256, for the site check below to typeset each formula with.
      # Like that check, it never fails the build or stops a deploy.
      - name: Install pinned MathJax 3.2.2 (report only)
        continue-on-error: true
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 5m curl -sSfL --retry 4 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --speed-limit 1024 --speed-time 30 \
            https://registry.npmjs.org/mathjax/-/mathjax-3.2.2.tgz -o "$RUNNER_TEMP/mathjax.tgz"
          echo "1b9c0a1c44df864e915690558e72adb9cc5203360daefd385084ced3b6c64c09  $RUNNER_TEMP/mathjax.tgz" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mathjax"
          tar xzf "$RUNNER_TEMP/mathjax.tgz" -C "$RUNNER_TEMP/mathjax"

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.7.7
          --with mkdocs-literate-nav==0.6.2
          --with markdown==3.10.3
          --with pymdown-extensions==11.0.1
          mkdocs build --strict

      # Lists internal links and anchors that lead nowhere, which `--strict`
      # never checks in render's raw HTML, statement cards the build dropped,
      # and, when this AUTOFORM_REF's site check has --mathjax, each formula
      # MathJax rejects and each command it does not know. Like the audit, it
      # never fails the build or stops a deploy.
      - name: Check the built site (report only)
        continue-on-error: true
        run: |
          autoform="git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          mathjax=()
          help="$(uvx --from "$autoform" autoform site check --help)"
          case "$help" in
            *--mathjax*) mathjax=(--mathjax "$RUNNER_TEMP/mathjax/package") ;;
          esac
          uvx --from "$autoform" autoform site check site --source site-src "${mathjax[@]}"

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_run'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_run'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
