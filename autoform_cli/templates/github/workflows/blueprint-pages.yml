name: Blueprint Pages

on:
  push:
    branches: [main]
    paths:
      - "blueprint/**"
      - "**.lean"
      - "lakefile.*"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "mkdocs.yml"
      - "theme/**"
      - ".github/autoform_audit.py"
      - ".github/workflows/blueprint-pages.yml"
  pull_request:
    paths:
      - "blueprint/**"
      - "**.lean"
      - "lakefile.*"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "mkdocs.yml"
      - "theme/**"
      - ".github/autoform_audit.py"
      - ".github/workflows/blueprint-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: {{AUTOFORM_SOURCE_YAML}}
  AUTOFORM_REF: {{AUTOFORM_REF_YAML}}

concurrency:
  group: blueprint-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Validate the theorem DAG and source declarations
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject kernel-check bypass options
        run: |
          set -euo pipefail
          forbidden="skip""KernelTC"
          if matches="$(git grep -n -I "$forbidden" -- .)"; then
            printf 'Kernel-check bypass option found:\n%s\n' "$matches" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "failed to scan tracked files" >&2
              exit "$grep_status"
            fi
          fi
          echo "no kernel-check bypass option found"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get || echo "no cache available, building from source"

      - name: Build Lean
        run: |
          set -euo pipefail
          evaluated_config="$(mktemp "${RUNNER_TEMP:-/tmp}/autoform-lake-config.XXXXXX.toml")"
          trap 'rm -f "$evaluated_config"' EXIT
          rm -f "$evaluated_config"
          lake translate-config toml "$evaluated_config"
          root_package="$(uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            python .github/autoform_audit.py --root-package "$evaluated_config")"
          echo "AUTOFORM_ROOT_PACKAGE=$root_package" >> "$GITHUB_ENV"
          lake check-build
          lake clean "$root_package"
          lake build

      - name: Bind blueprint claims to built artifacts and audit the root package
        run: |
          set -euo pipefail
          archive="$(mktemp "${RUNNER_TEMP:-/tmp}/autoform-root-build.XXXXXX.tgz")"
          probe="$(mktemp "${RUNNER_TEMP:-/tmp}/autoform-artifact-probe.XXXXXX.lean")"
          trap 'rm -f "$archive" "$probe"' EXIT
          # Keep root ownership in its archive. The helper binds Mathlib claims
          # to the manifest-pinned canonical Git checkout and build traces.
          lake pack "$archive"
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            python .github/autoform_audit.py \
            "$AUTOFORM_ROOT_PACKAGE" "$archive" blueprint . "$probe"
          lake env lean "$probe"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # Writes site-src/: statement boxes, derived statuses, the Mermaid graph,
      # and permalinks into the Lean code at this exact commit.
      - name: Render the blueprint
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform render blueprint
          --output site-src
          --lean-root .
          --require-declarations

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.6.21
          --with mkdocs-literate-nav==0.6.2
          --with pymdown-extensions==10.21.3
          mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
