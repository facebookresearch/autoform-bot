# Builds the Lean project and validates its Autoform blueprint on neutral
# hardware. Actions and the Autoform source are pinned immutably.

name: autoform verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: {{AUTOFORM_SOURCE_YAML}}
  AUTOFORM_REF: {{AUTOFORM_REF_YAML}}

concurrency:
  group: autoform-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Check out verified Autoform
        run: |
          set -euo pipefail
          export AUTOFORM_DIR="${RUNNER_TEMP}/autoform"
          export AUTOFORM_ENV="${RUNNER_TEMP}/autoform-env"
          test ! -e "$AUTOFORM_DIR" && test ! -L "$AUTOFORM_DIR"
          test ! -e "$AUTOFORM_ENV" && test ! -L "$AUTOFORM_ENV"
          git_home="${RUNNER_TEMP}/autoform-git-home"
          test ! -e "$git_home" && test ! -L "$git_home"
          install -d -m 700 "$git_home"
          safe_git() {
            env -i PATH="$PATH" HOME="$git_home" USERPROFILE="$git_home" \
              XDG_CONFIG_HOME="$git_home" LC_ALL=C NETRC=/dev/null \
              HTTP_PROXY="${HTTP_PROXY:-}" HTTPS_PROXY="${HTTPS_PROXY:-}" \
              NO_PROXY="${NO_PROXY:-}" http_proxy="${http_proxy:-}" \
              https_proxy="${https_proxy:-}" no_proxy="${no_proxy:-}" \
              GCM_INTERACTIVE=never GIT_ASKPASS=/bin/false \
              GIT_ATTR_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
              GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
              git -c core.askPass=/bin/false -c core.hooksPath=/dev/null \
              -c credential.helper= -c protocol.allow=never \
              -c protocol.https.allow=always "$@"
          }
          safe_git init --quiet --template= "$AUTOFORM_DIR"
          safe_git -C "$AUTOFORM_DIR" remote add origin "$AUTOFORM_SOURCE"
          safe_git -C "$AUTOFORM_DIR" fetch --depth=1 --no-tags \
            --no-recurse-submodules origin "$AUTOFORM_REF"
          resolved="$(safe_git -C "$AUTOFORM_DIR" rev-parse --verify 'FETCH_HEAD^{commit}')"
          test "$resolved" = "$AUTOFORM_REF"
          safe_git -C "$AUTOFORM_DIR" checkout --quiet --detach "$resolved"
          test ! -e "$AUTOFORM_DIR/.venv" && test ! -L "$AUTOFORM_DIR/.venv"
          echo "AUTOFORM_DIR=$AUTOFORM_DIR" >> "$GITHUB_ENV"
          echo "AUTOFORM_ENV=$AUTOFORM_ENV" >> "$GITHUB_ENV"
          host_python="$(command -v python)"
          test -x "$host_python"
          test "$("$host_python" -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          (
            cd "$RUNNER_TEMP"
            env -i PATH="$PATH" HOME="$git_home" LC_ALL=C PYTHONNOUSERSITE=1 \
              HTTP_PROXY="${HTTP_PROXY:-}" HTTPS_PROXY="${HTTPS_PROXY:-}" \
              NO_PROXY="${NO_PROXY:-}" http_proxy="${http_proxy:-}" \
              https_proxy="${https_proxy:-}" no_proxy="${no_proxy:-}" \
              UV_PROJECT_ENVIRONMENT="$AUTOFORM_ENV" \
              uv sync --no-config --locked --no-install-project --no-build \
              --no-cache --no-python-downloads --python "$host_python" \
              --project "$AUTOFORM_DIR"
          )

      - name: Validate the theorem DAG
        run: >-
          "$AUTOFORM_ENV/bin/python" -I -c
          'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));sys.argv[0]="autoform";runpy.run_module("autoform_cli",run_name="__main__")'
          "$AUTOFORM_DIR" check blueprint

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject kernel-check bypass options
        run: |
          set -euo pipefail
          # Scan all tracked text, including Lake configuration. Keep the
          # forbidden token split so this checker does not match itself.
          forbidden="skip""KernelTC"
          if matches="$(git grep -n -I "$forbidden" -- .)"; then
            printf 'Kernel-check bypass option found:\n%s\n' "$matches" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "failed to scan tracked files" >&2
              exit "$grep_status"
            fi
          fi
          echo "no kernel-check bypass option found"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get || echo "no cache available — building from source"

      # Evaluate either Lake manifest language, then clean only the root package.
      # Bare `lake clean` would also delete dependency build caches.
      - name: Build Lean
        run: |
          set -euo pipefail
          evaluated_config="$(mktemp "${RUNNER_TEMP:-/tmp}/autoform-lake-config.XXXXXX.toml")"
          trap 'rm -f "$evaluated_config"' EXIT
          rm -f "$evaluated_config"
          lake translate-config toml "$evaluated_config"
          root_package="$(python3 .github/autoform_audit.py --root-package "$evaluated_config")"
          echo "AUTOFORM_ROOT_PACKAGE=$root_package" >> "$GITHUB_ENV"
          lake check-build
          lake clean "$root_package"
          lake build

      - name: Audit every root-package declaration
        run: |
          set -euo pipefail
          archive="$(mktemp "${RUNNER_TEMP:-/tmp}/autoform-root-build.XXXXXX.tgz")"
          probe="$(mktemp "${RUNNER_TEMP:-/tmp}/autoform-axiom-probe.XXXXXX.lean")"
          trap 'rm -f "$archive" "$probe"' EXIT
          # Lake resolves both manifest languages and package/custom buildDir.
          # `lake pack` archives only the root package's actual build directory,
          # leaving dependency package artifacts outside the audit boundary.
          lake pack "$archive"
          python3 .github/autoform_audit.py \
            "$AUTOFORM_ROOT_PACKAGE" "$archive" "$probe"
          lake env lean "$probe"
