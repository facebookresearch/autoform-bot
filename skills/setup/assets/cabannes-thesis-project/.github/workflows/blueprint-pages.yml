name: Blueprint Pages

# A push to main deploys only after `autoform verify` passes on that commit, so
# the site never shows a status CI did not verify. Verify runs on every push to
# main and workflow_run has no paths filter, so every verified push redeploys,
# even one that changes nothing the site shows. A pull request builds the site
# without deploying it, and so does a manual run: redeploy by re-running the
# latest verify run on main.
on:
  workflow_run:
    workflows: ["autoform verify"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "blueprint/**"
      - "**.lean"
      - "mkdocs.yml"
      - "theme/**"
      - ".github/workflows/blueprint-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"
  AUTOFORM_REF: "c994d83f9fab1f40d69b2f279d4c62ca937a0186"

concurrency:
  group: blueprint-pages
  cancel-in-progress: false

jobs:
  build:
    # A verify run on a fork's pull request can carry head_branch main, so a
    # workflow_run build also requires a push from this repository.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # The commit verify passed, not whatever main points at now.
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # Rejects cycles and dangling links, and fails when a node names a Lean
      # declaration that is not in the sources.
      - name: Validate the theorem DAG and its declarations
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

      # Writes site-src/: statement boxes, derived statuses, the Mermaid graph,
      # and permalinks into the Lean code at this exact commit.
      - name: Render the blueprint
        env:
          SITE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform render blueprint
          --output site-src
          --lean-root .
          --ref "$SITE_REF"
          --require-declarations

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.6.21
          --with mkdocs-literate-nav==0.6.2
          --with pymdown-extensions==10.21.3
          mkdocs build --strict

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
