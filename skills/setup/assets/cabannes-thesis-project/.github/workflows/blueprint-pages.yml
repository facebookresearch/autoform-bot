name: Blueprint Pages

on:
  push:
    branches: [main]
    paths:
      - "blueprint/**"
      - "**.lean"
      - "mkdocs.yml"
      - "theme/**"
      - ".github/workflows/blueprint-pages.yml"
  pull_request:
    paths:
      - "blueprint/**"
      - "**.lean"
      - "mkdocs.yml"
      - "theme/**"
      - ".github/workflows/blueprint-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"
  AUTOFORM_REF: "45ca2ecff4c86c0cbcf82c3471dac27ebb956a89"

concurrency:
  group: blueprint-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Check out verified Autoform
        run: |
          set -euo pipefail
          export AUTOFORM_DIR="${RUNNER_TEMP}/autoform"
          export AUTOFORM_ENV="${RUNNER_TEMP}/autoform-env"
          test ! -e "$AUTOFORM_DIR" && test ! -L "$AUTOFORM_DIR"
          test ! -e "$AUTOFORM_ENV" && test ! -L "$AUTOFORM_ENV"
          git_home="${RUNNER_TEMP}/autoform-git-home"
          test ! -e "$git_home" && test ! -L "$git_home"
          install -d -m 700 "$git_home"
          safe_git() {
            env -i PATH="$PATH" HOME="$git_home" USERPROFILE="$git_home" \
              XDG_CONFIG_HOME="$git_home" LC_ALL=C NETRC=/dev/null \
              HTTP_PROXY="${HTTP_PROXY:-}" HTTPS_PROXY="${HTTPS_PROXY:-}" \
              NO_PROXY="${NO_PROXY:-}" http_proxy="${http_proxy:-}" \
              https_proxy="${https_proxy:-}" no_proxy="${no_proxy:-}" \
              GCM_INTERACTIVE=never GIT_ASKPASS=/bin/false \
              GIT_ATTR_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
              GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
              git -c core.askPass=/bin/false -c core.hooksPath=/dev/null \
              -c credential.helper= -c protocol.allow=never \
              -c protocol.https.allow=always "$@"
          }
          safe_git init --quiet --template= "$AUTOFORM_DIR"
          safe_git -C "$AUTOFORM_DIR" remote add origin "$AUTOFORM_SOURCE"
          safe_git -C "$AUTOFORM_DIR" fetch --depth=1 --no-tags \
            --no-recurse-submodules origin "$AUTOFORM_REF"
          resolved="$(safe_git -C "$AUTOFORM_DIR" rev-parse --verify 'FETCH_HEAD^{commit}')"
          test "$resolved" = "$AUTOFORM_REF"
          safe_git -C "$AUTOFORM_DIR" checkout --quiet --detach "$resolved"
          test ! -e "$AUTOFORM_DIR/.venv" && test ! -L "$AUTOFORM_DIR/.venv"
          echo "AUTOFORM_DIR=$AUTOFORM_DIR" >> "$GITHUB_ENV"
          echo "AUTOFORM_ENV=$AUTOFORM_ENV" >> "$GITHUB_ENV"
          host_python="$(command -v python)"
          test -x "$host_python"
          test "$("$host_python" -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          (
            cd "$RUNNER_TEMP"
            env -i PATH="$PATH" HOME="$git_home" LC_ALL=C PYTHONNOUSERSITE=1 \
              HTTP_PROXY="${HTTP_PROXY:-}" HTTPS_PROXY="${HTTPS_PROXY:-}" \
              NO_PROXY="${NO_PROXY:-}" http_proxy="${http_proxy:-}" \
              https_proxy="${https_proxy:-}" no_proxy="${no_proxy:-}" \
              UV_PROJECT_ENVIRONMENT="$AUTOFORM_ENV" \
              uv sync --no-config --locked --no-install-project --no-build \
              --no-cache --no-python-downloads --python "$host_python" \
              --project "$AUTOFORM_DIR" --extra dev
          )

      # Rejects cycles and dangling links, and fails when a node names a Lean
      # declaration that is not in the sources.
      - name: Validate the theorem DAG and its declarations
        run: >-
          "$AUTOFORM_ENV/bin/python" -I -c
          'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));sys.argv[0]="autoform";runpy.run_module("autoform_cli",run_name="__main__")'
          "$AUTOFORM_DIR" check blueprint --lean-root .

      # Writes site-src/: statement boxes, derived statuses, the Mermaid graph,
      # and permalinks into the Lean code at this exact commit.
      - name: Render the blueprint
        run: >-
          "$AUTOFORM_ENV/bin/python" -I -c
          'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));sys.argv[0]="autoform";runpy.run_module("autoform_cli",run_name="__main__")'
          "$AUTOFORM_DIR" render blueprint
          --output site-src
          --lean-root .
          --require-declarations

      - name: Build the Markdown site
        run: >-
          "$AUTOFORM_ENV/bin/python" -I -m mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
