# Builds the Lean project and binds roadmap claims to kernel-checked artifacts.
# Actions and the Autoform source are pinned immutably.

name: autoform verify

on:
  workflow_call:
  pull_request:
    paths:
      - "blueprint/**"
      - "**.lean"
      - "lakefile.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/autoform_audit.py"
      - ".github/workflows/autoform-verify.yml"
      - ".github/workflows/blueprint-pages.yml"
  push:
    branches: [main]
    paths:
      - "blueprint/**"
      - "**.lean"
      - "lakefile.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/autoform_audit.py"
      - ".github/workflows/autoform-verify.yml"
      - ".github/workflows/blueprint-pages.yml"

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/VivienCabannes/autoform-bot.git"
  AUTOFORM_REF: "43097b2c07e68df899d6b8bca7849d091c294754"

concurrency:
  group: autoform-verification-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install pinned Autoform
        run: |
          set -euo pipefail
          if [[ ! "$AUTOFORM_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "AUTOFORM_REF must be one full lowercase commit hash" >&2
            exit 1
          fi
          environment="$RUNNER_TEMP/autoform-venv"
          uv venv --python 3.12 "$environment"
          uv pip install --python "$environment/bin/python" "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          echo "$environment/bin" >> "$GITHUB_PATH"

      - name: Validate the theorem DAG
        run: autoform check blueprint

      - name: Preflight artifact claims
        run: python -I .github/autoform_audit.py preflight blueprint

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject kernel-check bypass options
        run: |
          set -euo pipefail
          forbidden="skip""KernelTC"
          if matches="$(git grep -n -I "$forbidden" -- .)"; then
            printf 'Kernel-check bypass option found:\n%s\n' "$matches" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi

      - name: Fetch the Mathlib build cache
        run: lake exe cache get || echo "no cache available, building from source"

      - name: Verify roadmap claims and build artifacts
        run: >-
          python -I .github/autoform_audit.py verify
          blueprint
          .
